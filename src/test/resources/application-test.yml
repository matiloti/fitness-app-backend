# =============================================================================
# FitTrack Pro - Test Configuration
# =============================================================================
# Override settings for test execution with Testcontainers
# =============================================================================

spring:
  datasource:
    url: jdbc:tc:postgresql:16:///fittrack_test
    driver-class-name: org.testcontainers.jdbc.ContainerDatabaseDriver

  flyway:
    enabled: true
    clean-disabled: false

app:
  jwt:
    secret: test-secret-key-for-unit-tests-must-be-at-least-256-bits-long-for-hs256
    access-token-expiry: 900000
    refresh-token-expiry: 604800000

logging:
  level:
    root: WARN
    com.fittrack: DEBUG
